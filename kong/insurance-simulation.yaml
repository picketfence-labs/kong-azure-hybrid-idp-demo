# simulation API用Route（Group 2）。設計・注意点はkong/insurance-product.yamlのコメント参照。
# 実バックエンド（ghcr.io/picketfence-labs/insurance-simulation）はステートレスな
# 保険料試算のみ（POST /simulations、{id}系エンドポイントは無い）。
_format_version: "3.0"
services:
  - name: insurance-simulation
    protocol: http
    host: insurance-simulation
    port: 8000
    path: /simulations
    routes:
      - name: insurance-simulation
        protocols:
          - http
        paths:
          - /simulation
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - bearer
              upstream_headers:
                - header: X-ADFS-Group-Claim
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"
          - name: legacy-authz-adapter
            config:
              # design-brief グループ⇔APIアクセスマトリクス: simulationはit/sales/new-businessのみ許可
              allowed_groups:
                - it
                - sales
                - new-business
