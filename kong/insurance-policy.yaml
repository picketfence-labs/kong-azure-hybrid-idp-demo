# policy API用Route（Group 2）。設計・注意点はkong/insurance-product.yamlのコメント参照。
# 実バックエンド（ghcr.io/picketfence-labs/insurance-policy）の実パスは複数形
# （/policies、/policies/{policy_id}、不規則複数形であることを実機で確認済み）。
_format_version: "3.0"
services:
  - name: insurance-policy
    protocol: http
    host: insurance-policy
    port: 8000
    path: /policies
    routes:
      - name: insurance-policy
        protocols:
          - http
        paths:
          - /policy
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - bearer
              upstream_headers:
                - header: X-ADFS-Group-Claim
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"
          - name: legacy-authz-adapter
            config:
              # design-brief グループ⇔APIアクセスマトリクス: policyは5グループ全て許可
              allowed_groups:
                - it
                - sales
                - new-business
                - policy-admin
                - claim
