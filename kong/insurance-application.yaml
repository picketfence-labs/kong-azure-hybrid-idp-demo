# application API用Route（Group 2）。設計・注意点はkong/insurance-product.yamlのコメント参照。
# 実バックエンド（ghcr.io/picketfence-labs/insurance-application）の実パスは複数形
# （/applications、/applications/{application_id}）。
_format_version: "3.0"
services:
  - name: insurance-application
    protocol: http
    host: insurance-application
    port: 8000
    path: /applications
    routes:
      - name: insurance-application
        protocols:
          - http
        paths:
          - /application
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              # ADFSはaccess tokenのiss claimに、discoveryのissuer（config.issuer）とは異なる
              # WS-Trust由来のレガシー値（http://<FQDN>/adfs/services/trust）を発行する仕様がある。
              # 実機で"invalid issuer ... was specified for access token"を確認済み
              # （docs/troubleshooting-log.md参照）。両方のissuerを許容する。
              issuers_allowed:
                - "${{ env "DECK_ADFS_ISSUER" }}"
                - "http://adfs.adfsdemo.picketfencelabs.local/adfs/services/trust"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - bearer
              upstream_headers:
                - header: X-ADFS-Group-Claim
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"
          - name: legacy-authz-adapter
            config:
              # design-brief グループ⇔APIアクセスマトリクス: applicationはit/sales/new-businessのみ許可
              allowed_groups:
                - it
                - sales
                - new-business

      # insurance-uiのADFSセッションから直接呼べるデモ用Route（bearerトークン取得を要求せず、
      # ブラウザのみで権限差を確認するためTESTING.md「Group 2」節向けに追加）。
      # 認可判定・許可グループは上のbearer用Routeと同一で、認証方式だけがsessionに変わる。
      - name: insurance-adfs-call-application
        protocols:
          - http
        paths:
          - /adfs/call/application
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - session
              session_secret: "${{ env "DECK_ADFS_SESSION_SECRET" }}"
              session_audience: insurance-adfs
              session_cookie_name: insurance_adfs_session
              session_cookie_path: /adfs
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              upstream_headers:
                - header: X-ADFS-Group-Claim
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"
          - name: legacy-authz-adapter
            config:
              allowed_groups:
                - it
                - sales
                - new-business
