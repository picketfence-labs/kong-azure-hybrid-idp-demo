# G1/G2 PoC: 共通insurance-uiを匿名で表示し、Entra IDとADFSの認証だけを別Routeへ分離する。
# API Route、DB認可、図の実イベント連動はこのPoCに含めない。
#
# login Routeとsession Routeは同じidentity内でsession設定を一致させる。login成功後は
# login_tokensを空にしてtokenをURLへ含めず、匿名の完了ページへredirectする。完了通知は
# 認証成功の根拠にせず、元画面がsession Routeを再確認する契機としてだけ使う。
_format_version: "3.0"
services:
  - name: insurance-ui
    protocol: http
    host: insurance-ui
    port: 3000
    routes:
      - name: insurance-ui-shell
        protocols:
          - http
        paths:
          - /insurance
        strip_path: false

  - name: insurance-entra-auth-login
    protocol: http
    host: insurance-ui
    port: 3000
    path: /insurance/auth/complete/entra
    routes:
      - name: insurance-entra-auth-login
        protocols:
          - http
        paths:
          - "~/entra/auth/(?:start|callback)$"
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ENTRA_ISSUER" }}"
              client_id:
                - "${{ env "DECK_MIDDLE_TIER_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_MIDDLE_TIER_CLIENT_SECRET" }}"
              auth_methods:
                - session
                - authorization_code
              scopes:
                - openid
                - profile
              redirect_uri:
                - "http://localhost:8000/entra/auth/callback"
              login_action: redirect
              login_redirect_uri:
                - "http://localhost:8000/insurance/auth/complete/entra"
              # redirectの既定値はid_tokenをfragmentへ含めるため、空配列を明示する。
              login_tokens: []
              session_secret: "${{ env "DECK_ENTRA_INSURANCE_SESSION_SECRET" }}"
              session_audience: insurance-entra
              session_cookie_name: insurance_entra_session
              session_cookie_path: /entra
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              upstream_headers:
                - header: X-Demo-Verified-Attribute
                  path:
                    - groups

  - name: insurance-entra-auth-session
    protocol: http
    host: insurance-ui
    port: 3000
    path: /insurance/api/auth-status/entra
    routes:
      - name: insurance-entra-auth-session
        protocols:
          - http
        paths:
          - "~/entra/auth/(?:status|logout)$"
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ENTRA_ISSUER" }}"
              client_id:
                - "${{ env "DECK_MIDDLE_TIER_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_MIDDLE_TIER_CLIENT_SECRET" }}"
              auth_methods:
                - session
              session_secret: "${{ env "DECK_ENTRA_INSURANCE_SESSION_SECRET" }}"
              session_audience: insurance-entra
              session_cookie_name: insurance_entra_session
              session_cookie_path: /entra
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              logout_uri_suffix: /entra/auth/logout
              logout_methods:
                - POST
              logout_redirect_uri:
                - "http://localhost:8000/insurance/auth/complete/entra?logged_out=1"
              upstream_headers:
                - header: X-Demo-Verified-Attribute
                  path:
                    - groups

  - name: insurance-adfs-auth-login
    protocol: http
    host: insurance-ui
    port: 3000
    path: /insurance/auth/complete/adfs
    routes:
      - name: insurance-adfs-auth-login
        protocols:
          - http
        paths:
          - "~/adfs/auth/(?:start|callback)$"
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - session
                - authorization_code
              scopes:
                - openid
                - profile
                - allatclaims
                - user_impersonation
              # ADFSがWeb APIのcustom claimをID tokenへ含めるallatclaimsにはform_postが必要。
              response_mode: form_post
              # 別siteのADFSからPOSTされるcallbackでもstate Cookieを送る。
              # Secure Cookieは対象デモoriginがlocalhostのためHTTPでも利用できる。
              authorization_cookie_same_site: None
              authorization_cookie_secure: true
              authorization_query_args_names:
                - resource
              authorization_query_args_values:
                - "${{ env "DECK_ADFS_RESOURCE" }}"
              redirect_uri:
                - "http://localhost:8000/adfs/auth/callback"
              login_action: redirect
              login_redirect_uri:
                - "http://localhost:8000/insurance/auth/complete/adfs"
              login_tokens: []
              session_secret: "${{ env "DECK_ADFS_SESSION_SECRET" }}"
              session_audience: insurance-adfs
              session_cookie_name: insurance_adfs_session
              session_cookie_path: /adfs
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              upstream_headers:
                - header: X-Demo-Verified-Attribute
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"

  - name: insurance-adfs-auth-session
    protocol: http
    host: insurance-ui
    port: 3000
    path: /insurance/api/auth-status/adfs
    routes:
      - name: insurance-adfs-auth-session
        protocols:
          - http
        paths:
          - "~/adfs/auth/(?:status|logout)$"
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - session
              session_secret: "${{ env "DECK_ADFS_SESSION_SECRET" }}"
              session_audience: insurance-adfs
              session_cookie_name: insurance_adfs_session
              session_cookie_path: /adfs
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              logout_uri_suffix: /adfs/auth/logout
              logout_methods:
                - POST
              logout_redirect_uri:
                - "http://localhost:8000/insurance/auth/complete/adfs?logged_out=1"
              upstream_headers:
                - header: X-Demo-Verified-Attribute
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"

  # G2専用probe。DBや本番のAPI認可表には使わない。OpenID Connect pluginが外部入力の
  # 同名Headerを除去して検証済みclaimだけを設定した後、低priorityのcustom pluginが読む。
  - name: insurance-adfs-authz-probe
    protocol: http
    host: insurance-ui
    port: 3000
    path: /insurance/api/auth-status/adfs
    routes:
      - name: insurance-adfs-authz-probe
        protocols:
          - http
        paths:
          - "~/adfs/auth/probe$"
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "${{ env "DECK_ADFS_ISSUER" }}"
              client_id:
                - "${{ env "DECK_ADFS_CLIENT_ID" }}"
              client_secret:
                - "${{ env "DECK_ADFS_CLIENT_SECRET" }}"
              auth_methods:
                - session
              session_secret: "${{ env "DECK_ADFS_SESSION_SECRET" }}"
              session_audience: insurance-adfs
              session_cookie_name: insurance_adfs_session
              session_cookie_path: /adfs
              session_cookie_same_site: Lax
              session_cookie_http_only: true
              upstream_headers:
                - header: X-Demo-Verified-Attribute
                  path:
                    - "${{ env "DECK_ADFS_GROUP_CLAIM_NAME" }}"
          - name: legacy-authz-adapter
            config:
              group_claim_header: X-Demo-Verified-Attribute
              group_header_name: X-Demo-Probe-Group
              known_groups:
                - "${{ env "DECK_ADFS_POC_ATTRIBUTE_VALUE" }}"
              allowed_groups:
                - "${{ env "DECK_ADFS_POC_ATTRIBUTE_VALUE" }}"
